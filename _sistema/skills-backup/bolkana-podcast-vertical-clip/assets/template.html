<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* ===== Bolkana brand layer (source: assets/brand + references/brand.md) ===== */
@font-face{font-family:'Outfit';font-weight:300;src:url('brand/fonts/Outfit-Light.ttf') format('truetype')}
@font-face{font-family:'Outfit';font-weight:400;src:url('brand/fonts/Outfit-Regular.ttf') format('truetype')}
@font-face{font-family:'Outfit';font-weight:500;src:url('brand/fonts/Outfit-Medium.ttf') format('truetype')}
@font-face{font-family:'Outfit';font-weight:600;src:url('brand/fonts/Outfit-SemiBold.ttf') format('truetype')}
@font-face{font-family:'Karla';font-weight:300;src:url('brand/fonts/Karla-Light.ttf') format('truetype')}
@font-face{font-family:'Karla';font-weight:400;src:url('brand/fonts/Karla-Regular.ttf') format('truetype')}
@font-face{font-family:'Karla';font-weight:500;src:url('brand/fonts/Karla-Medium.ttf') format('truetype')}
@font-face{font-family:'Karla';font-weight:600;src:url('brand/fonts/Karla-SemiBold.ttf') format('truetype')}
@font-face{font-family:'Karla';font-weight:700;src:url('brand/fonts/Karla-Bold.ttf') format('truetype')}
:root{
 /* brand book colours — quote verbatim, never invent new hues */
 --graphite:#232323;--bone:#F3F3F3;--lava:#D31C1F;--grass:#5CD41C;--lava-soft:#D54B4D;--grass-soft:#44A85A;
 --surface:#141414;--deep:#0D0D0D;--muted:#6B7C89;--fg2:#999999;
 --display:'Outfit',sans-serif;--body:'Karla',sans-serif;
 /* legacy aliases so older scene code keeps working on-brand */
 --ink:var(--graphite);--paper:var(--bone);--y:var(--grass);--red:var(--lava);--w:var(--bone)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#232323}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:var(--graphite);font-family:var(--body);color:var(--bone)}
/* camera: one clipping panel per speaker; the layer holds the full-size source frame and is moved/scaled by the tracker */
#stage{position:absolute;inset:0;overflow:hidden;background:var(--graphite)}
.panel{position:absolute;left:0;width:1080px;overflow:hidden}
#pT{top:0;height:1920px}
#pB{top:1920px;height:0}
.layer{position:absolute;left:0;top:0;width:__SRCW__px;height:__SRCH__px;transform-origin:0 0}
.layer video{position:absolute;left:0;top:0;width:__SRCW__px;height:__SRCH__px;__FOOTAGE_FILTER__}
/* split seam: the brand gradient as a hairline accent (lava → grass) */
#seam{position:absolute;left:0;right:0;top:958px;height:4px;background:linear-gradient(90deg,var(--lava),var(--grass));opacity:0}
#shade{position:absolute;inset:0;pointer-events:none;background:
 linear-gradient(180deg,rgba(35,35,35,.55) 0%,rgba(35,35,35,.32) 12%,rgba(35,35,35,0) 24%,rgba(35,35,35,0) 58%,rgba(35,35,35,.62) 80%,rgba(35,35,35,.8) 100%)}
#tint{position:absolute;inset:0;background:var(--graphite);opacity:0}
/* Bolkana glow: a splash of Lava + a splash of Grass, soft-edged, ≤25 % of the frame, an accent never the subject */
.glow{position:absolute;pointer-events:none;border-radius:50%;filter:blur(100px);opacity:0;
 background:radial-gradient(closest-side at 62% 60%,rgba(211,28,31,.95),rgba(211,28,31,.55) 55%,rgba(211,28,31,0) 100%),
            radial-gradient(closest-side at 40% 38%,rgba(92,212,28,.8),rgba(92,212,28,.35) 55%,rgba(92,212,28,0) 100%)}
#glowT{left:-260px;top:1040px;width:760px;height:760px}
/* brand header v2 (client, 2026-10-01) — Bolkana logotype + Ibinn sponsor side by side in the row of Instagram's
   back arrow (x≈100–135) and camera (x≈932–985), y≈165–215 of the frame, with "En colaboración con" over Ibinn;
   the YouTube handle sits at y≈1566, between the captions and IG's username line. Scene elements stay below y≈400. */
#hdr{position:absolute;left:0;right:0;top:0;height:1920px;display:block;opacity:0;pointer-events:none}
#hdr .bk{position:absolute;left:327px;top:174px;width:236px;height:auto}
#hdr .sp{position:absolute;left:635px;top:165px;height:58px;width:auto}
#hdr::after{content:"En colaboración con";position:absolute;left:694px;top:131px;transform:translateX(-50%);font-family:var(--body);font-weight:500;font-size:26px;line-height:1;letter-spacing:.01em;color:var(--bone);white-space:nowrap}
#hdr .yt{position:absolute;left:0;right:0;top:1566px;height:48px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--body);font-weight:500;font-size:28px;letter-spacing:.01em;color:var(--bone);white-space:nowrap}
#hdr .yt .ico{font-size:40px}
/* title: eyebrow (isotype + programme) + two sentence-case Outfit SemiBold lines */
#title{position:absolute;left:130px;right:130px;top:990px}
#title .eb{display:flex;align-items:center;gap:16px;height:44px;margin-bottom:18px;font-family:var(--body);font-weight:500;font-size:30px;letter-spacing:.02em;color:var(--bone);opacity:0}
#title .eb img{height:26px;width:auto;display:block}
#title .ln{display:block;overflow:hidden;padding:4px 0 8px}
#title .ln span{display:block;white-space:nowrap;font-family:var(--display);font-weight:600;font-size:88px;line-height:1.02;letter-spacing:-.015em;color:var(--bone);text-shadow:0 8px 34px rgba(0,0,0,.45)}
/* captions (1–2 words, hard in/out, keyword in Grass) */
#caps{position:absolute;left:180px;right:180px;top:1392px;height:130px}  /* clear of the side crop and the IG action column (right ≈178 px) */
.cg{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:20px;opacity:0}
.cg span{display:block;font-family:var(--display);font-weight:600;font-size:84px;line-height:1;letter-spacing:-.01em;color:var(--bone);white-space:nowrap;
 text-shadow:0 4px 24px rgba(0,0,0,.72),0 2px 4px rgba(0,0,0,.55)}
.cg span.k{color:var(--grass)}
.cg span.red{color:var(--lava)}   /* climax / emphasis words (redWords) — the default climax, instead of a big slab */
/* shared scene vocabulary (dark ground · hairline borders · no drop shadows · no italics) */
.scene{position:absolute;inset:0;opacity:0}
.card{position:absolute;left:130px;width:820px;border-radius:28px;background:rgba(20,20,20,.94);border:2px solid rgba(107,124,137,.55);color:var(--bone)}
.card.light{background:var(--bone);border-color:transparent;color:var(--graphite)}
.eyebrow{font-family:var(--body);font-weight:500;font-size:30px;letter-spacing:.02em;color:var(--grass)}
.card.light .eyebrow{color:var(--muted)}
.h{font-family:var(--display);font-weight:600;letter-spacing:-.015em;line-height:1.02}
.chip{position:absolute;left:130px;display:flex;align-items:center;gap:18px;height:96px;padding:0 38px 0 20px;border-radius:100px;background:var(--bone);color:var(--graphite);font-family:var(--display);font-weight:600;font-size:46px;white-space:nowrap;opacity:0}
.chip .x{display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:30px;background:var(--lava);color:var(--bone);flex:none}
.chip.dark{background:rgba(20,20,20,.94);border:2px solid rgba(107,124,137,.55);color:var(--bone)}
.chip.lava{background:var(--lava);color:var(--bone)}
.chip.lava .x{background:var(--bone);color:var(--lava)}
.chip s{text-decoration:none;position:relative}
.chip s:after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:7px;margin-top:-3px;border-radius:4px;background:var(--lava);transform:scaleX(var(--strike,0));transform-origin:left center}
.ico{display:inline-block;width:1em;height:1em;flex:none;color:inherit}
.ico svg{display:block;width:100%;height:100%}
#flash{position:absolute;inset:0;background:var(--bone);opacity:0}

/* ---- project scenes ---- */
__SCENES_CSS__
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1080" data-height="1920">
  <div id="stage">
    <div class="panel" id="pT"><div class="layer" id="LT" data-layout-allow-overflow>
__VIDEOS__
    </div></div>
    <div class="panel" id="pB"><div class="layer" id="LB" data-layout-allow-overflow>
__VIDEOS_B__
    </div></div>
    <div id="tint"></div>
  </div>
  <div id="seam"></div>
__AUDIO__
__MUSIC__
__SFX__
  <div id="shade"></div>
  <div class="glow" id="glowT" data-layout-allow-overflow></div>

__SCENES_HTML__

  <div id="title">
    <div class="eb"><img src="brand/logos/isotype_bone.svg" alt="">__TITLE_PILL__</div>
    <div class="ln a"><span>__TITLE_A__</span></div>
    <div class="ln b"><span>__TITLE_B__</span></div>
  </div>
  <div id="caps"></div>
  <div id="flash"></div>
  <div id="hdr">
    <img class="bk" src="brand/logos/logotype_bone.svg" alt="Bolkana">
    <div class="yt">__YT_ICON____YT_HANDLE__</div>
    <img class="sp" src="brand/logos/ibinn_logotype.png" alt="Ibinn">
  </div>
</div>
<script>
const CFG=__CFG__;
const T=CFG.t, J=CFG.segs.map(s=>s.st);   // T: word/cut anchors in output seconds · J: jump-cut points
const tl=gsap.timeline({paused:true});
const IR={immediateRender:false};

// ---------- captions ----------
const capsEl=document.getElementById('caps');
CFG.caps.forEach((g,i)=>{
  if(g.w.some(w=>CFG.capSkip.includes(w[1]))) return;   // words a scene already slams on screen
  const d=document.createElement('div');d.className='cg';d.id='cg'+i;
  g.w.forEach(w=>{const s=document.createElement('span');if(w[2])s.className='k';s.textContent=w[1];d.appendChild(s);});
  capsEl.appendChild(d);
  tl.fromTo(d,{opacity:0,y:14},{opacity:1,y:0,duration:.09,ease:'power2.out',...IR},g.s);
  tl.set(d,{opacity:0},g.e);
});

// ---------- camera: speaker-tracked reframe + stacked split (pure function of time → seek-safe) ----------
const SW=CFG.srcW, SH=CFG.srcH;
function track(name,t){const a=CFG.trk[name];if(t<=a[0][0])return[a[0][1],a[0][2]];
  for(let i=1;i<a.length;i++){if(t<=a[i][0]){const p=(t-a[i-1][0])/(a[i][0]-a[i-1][0]);return[a[i-1][1]+(a[i][1]-a[i-1][1])*p,a[i-1][2]+(a[i][2]-a[i-1][2])*p];}}
  const l=a[a.length-1];return[l[1],l[2]];}
const E={out:p=>1-Math.pow(1-p,3), io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
function frameAt(keys,t,H){
  let i=0;while(i+1<keys.length&&keys[i+1].t<=t)i++;
  const val=(k,tt,next)=>{const [cx,cy]=track(k.who,tt);const span=(next?next.t:CFG.total)-k.t;
    const p=Math.min(1,Math.max(0,(tt-k.t)/span));return{cx,cy,s:k.s+(k.s1-k.s)*p,fx:k.fx,fy:k.fy};};
  const k=keys[i],cur=val(k,t,keys[i+1]);
  if(k.d>0&&i>0&&t<k.t+k.d){const prev=val(keys[i-1],t,k);const p=E[k.e]((t-k.t)/k.d);
    for(const q in cur)cur[q]=prev[q]+(cur[q]-prev[q])*p;}
  const s=Math.max(cur.s,1080/SW,H/SH);                 // never reveal an edge of the source
  let x=1080*cur.fx-cur.cx*s, y=H*cur.fy-cur.cy*s;
  x=Math.min(0,Math.max(1080-SW*s,x)); y=Math.min(0,Math.max(H-SH*s,y));
  return 'translate('+x.toFixed(2)+'px,'+y.toFixed(2)+'px) scale('+s.toFixed(4)+')';
}
function splitAt(t){const S=CFG.split;let i=0;while(i+1<S.length&&S[i+1][0]<=t)i++;const k=S[i];
  if(k[2]>0&&i>0&&t<k[0]+k[2]){const p=E.io((t-k[0])/k[2]);return S[i-1][1]+(k[1]-S[i-1][1])*p;}return k[1];}
const pT=document.getElementById('pT'),pB=document.getElementById('pB'),LT=document.getElementById('LT'),LB=document.getElementById('LB');
function applyCam(t){
  const h=splitAt(t);
  pT.style.height=h+'px'; pB.style.top=h+'px'; pB.style.height=(1920-h)+'px';
  LT.style.transform=frameAt(CFG.camTop,t,h);
  if(h<1919.5&&CFG.camBot.length)LB.style.transform=frameAt(CFG.camBot,t,1920-h);
  capsEl.style.transform='translateY('+(-(1920-h)/960*497).toFixed(2)+'px)'; // captions ride the seam while split
}
applyCam(0);
const camDrive={t:0};
tl.fromTo(camDrive,{t:0},{t:CFG.total,duration:CFG.total,ease:'none',...IR,onUpdate:()=>applyCam(camDrive.t)},0);
CFG.seam.forEach(w=>{tl.set('#seam',{opacity:1},w[0]);tl.set('#seam',{opacity:0},w[1]);});

// ---------- helpers for scenes ----------
const IN=(sel,t,o={})=>tl.fromTo(sel,{opacity:0,y:o.y??36,scale:o.s??.96,filter:'blur(10px)'},{opacity:1,y:0,scale:1,filter:'blur(0px)',duration:o.d??.42,ease:'power3.out',...IR},t);
const OUT=(sel,t,o={})=>tl.to(sel,{opacity:0,y:o.y??-20,filter:'blur(8px)',duration:o.d??.28,ease:'power2.in'},t);
// B-roll look: the facecam defocuses and darkens behind a card (blur dissolve)
function defocus(t0,t1,dIn=.38,dOut=.38){
  tl.fromTo('#stage',{filter:'blur(0px)'},{filter:'blur(26px)',duration:dIn,ease:'power2.inOut',...IR},t0);
  tl.fromTo('#tint',{opacity:0},{opacity:.55,duration:dIn,ease:'power2.inOut',...IR},t0);
  tl.to('#stage',{filter:'blur(0px)',duration:dOut,ease:'power2.inOut'},t1-dOut*.5);
  tl.to('#tint',{opacity:0,duration:dOut,ease:'power2.inOut'},t1-dOut*.5);
}
function scene(id,t0,t1){tl.set(id,{opacity:1},t0);tl.to(id,{opacity:0,filter:'blur(10px)',scale:1.03,duration:.3,ease:'power2.in'},t1-.3);}
function shake(t,sel='#stage'){[[-16,.04],[14,.08],[-9,.12],[6,.16],[0,.2]].forEach(k=>tl.to(sel,{x:k[0],duration:.04},t+k[1]));}
function flash(t){tl.fromTo('#flash',{opacity:0},{opacity:.75,duration:.04,...IR},t);tl.to('#flash',{opacity:0,duration:.32,ease:'power2.out'},t+.04);}
// redWords(['mortal','burnout'], 'cóctel'?) — paint caption words Lava (the default climax: captions stay, the key words turn red).
// Matching ignores case and punctuation. Common words ('un','a','lo') would match everywhere: pass the 2nd arg to limit the
// colouring to caption groups that also contain that word.
function redWords(words,inGroupWith){const n=x=>x.toLowerCase().replace(/[.,;:¡!¿?…"“”]/g,'');const W=words.map(n);
  CFG.caps.forEach((cg,i)=>{const el=document.getElementById('cg'+i);if(!el)return;
    if(inGroupWith&&!cg.w.some(w=>n(w[1])===n(inGroupWith)))return;
    el.querySelectorAll('span').forEach(sp=>{if(W.includes(n(sp.textContent)))sp.classList.add('red');});});}

// ---------- title (+ glow accent) · brand header ----------
// the title must be hidden on frame 0: IR tweens don't apply their from-state before they start (it used to flash fully
// visible at 0 s, vanish, then slide in). Set every start state at 0 explicitly.
const TI=Math.min(.35,Math.max(.05,CFG.titleOut-2.6));   // title entry: ~0.35 s, earlier when the first scene comes early (title needs ~1.4 s fully on screen)
tl.set('#title .eb',{opacity:0,x:-24},0); tl.set('#title .ln span',{yPercent:110},0); tl.set('#glowT',{opacity:0,scale:.85},0);
tl.fromTo('#title .eb',{opacity:0,x:-24},{opacity:1,x:0,duration:.45,ease:'power3.out',...IR},TI);
tl.fromTo('#title .ln.a span',{yPercent:110},{yPercent:0,duration:.6,ease:'power4.out',...IR},TI+.1);
tl.fromTo('#title .ln.b span',{yPercent:110},{yPercent:0,duration:.6,ease:'power4.out',...IR},TI+.25);
tl.fromTo('#glowT',{opacity:0,scale:.85},{opacity:.9,scale:1,duration:.9,ease:'power2.out',...IR},TI-.05);   // title enters at ~0.35 s (client: later, never on frame 0)
tl.to('#glowT',{x:40,y:-30,duration:Math.max(.5,CFG.titleOut-.8),ease:'sine.inOut'},.9);
tl.to('#title',{opacity:0,y:-30,filter:'blur(12px)',duration:.35,ease:'power2.in'},CFG.titleOut-.35);
tl.to('#glowT',{opacity:0,duration:.5,ease:'power2.in'},CFG.titleOut-.4);
if(CFG.header){tl.fromTo('#hdr',{opacity:0,y:-12},{opacity:1,y:0,duration:.5,ease:'power3.out',...IR},.1);}

// ---------- project scenes ----------
__SCENES_JS__

// no end card / outro: the clip ends on its last word (client request, 2026-10-03)

window.__timelines=window.__timelines||{};
window.__timelines['main']=tl;
</script>
</body>
</html>
